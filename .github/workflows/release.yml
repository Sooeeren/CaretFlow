# Builds Folio for Windows and Linux and attaches the files to a GitHub release.
# Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab.
# The release is created as a draft if it doesn't exist yet; publish it after checking the files.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Signs the installers for the in-app updater (key made with `npx tauri signer generate`).
  # Without the secret the build still works, but the release has no automatic update.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # full history: the About dialog counts lines per model with git blame
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Build
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then SIGN=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); else SIGN=(); echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: no in-app update for this build"; fi
          npx tauri build --bundles nsis "${SIGN[@]}"
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe.sig out/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/folio.exe out/Folio-portable.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    # the oldest supported Ubuntu keeps the binary and AppImage compatible with older glibc
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then SIGN=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); else SIGN=(); echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: no in-app update for this build"; fi
          npx tauri build --bundles appimage,deb,rpm "${SIGN[@]}"
      - name: Collect files
        run: |
          mkdir -p out
          B=src-tauri/target/release
          cp "$B"/bundle/appimage/*.AppImage "$B"/bundle/deb/*.deb "$B"/bundle/rpm/*.rpm out/
          cp "$B"/bundle/*/*.sig out/ 2>/dev/null || true
          cp "$B/folio" out/folio
          chmod +x out/*.AppImage out/folio
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh files
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Folio ${TAG#v}" --notes "Release notes to follow."
          # update manifest for the in-app updater; notes come from the release text if it's written already
          if ls files/*.sig >/dev/null 2>&1; then
            gh release view "$TAG" --json body -q .body > notes.md
            node scripts/update-manifest.mjs files --version "${TAG#v}" --notes notes.md --repo "$GH_REPO"
          fi
          gh release upload "$TAG" files/* --clobber
