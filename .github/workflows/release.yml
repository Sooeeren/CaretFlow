# Builds CaretFlow for Windows, Linux and Android and attaches the files to a GitHub release.
# Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab.
# The release is created as a draft if it doesn't exist yet; publish it after checking the files.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Signs the installers for the in-app updater (key made with `npx tauri signer generate`).
  # Without the secret the build still works, but the release has no automatic update.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # full history: the About dialog counts lines per model with git blame
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Build
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then SIGN=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); else SIGN=(); echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: no in-app update for this build"; fi
          npx tauri build --bundles nsis "${SIGN[@]}"
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe.sig out/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/caretflow.exe out/CaretFlow-portable.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  linux:
    # the oldest supported Ubuntu keeps the binary and AppImage compatible with older glibc
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils rpm cpio
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then SIGN=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); else SIGN=(); echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: no in-app update for this build"; fi
          npx tauri build --bundles appimage,deb,rpm "${SIGN[@]}"
      - name: Collect files
        run: |
          mkdir -p out
          B=src-tauri/target/release
          cp "$B"/bundle/appimage/*.AppImage out/
          cp "$B"/bundle/appimage/*.sig out/ 2>/dev/null || true
          # Tauri names the packages "caret-flow" (and older releases were "folio"): rebuild them as
          # "caretflow", replacing the old ones, and sign the rebuilt files for the updater
          bash scripts/deb-repackage.sh "$B"/bundle/deb/*.deb out
          bash scripts/rpm-repackage.sh "$B"/bundle/rpm/*.rpm out
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in out/CaretFlow_*.deb out/caretflow-*.rpm; do npx tauri signer sign --app-version "${TAG#v}" "$f"; done
          fi
          cp "$B/caretflow" out/caretflow
          chmod +x out/*.AppImage out/caretflow
          ls -lh out
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*

  arch:
    # pacman package (packaging/arch/PKGBUILD), repackaged from the .deb in an Arch container
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux
      - name: Build package
        run: |
          pacman -Syu --noconfirm --needed base-devel
          V="${TAG#v}"
          mkdir -p /tmp/pkg out
          cp packaging/arch/PKGBUILD "linux/CaretFlow_${V}_amd64.deb" /tmp/pkg/
          cd /tmp/pkg
          sed -i "s/^_ver=[^ ]*/_ver=$V/; s/^sha256sums=.*/sha256sums=('$(sha256sum "CaretFlow_${V}_amd64.deb" | cut -d' ' -f1)')/" PKGBUILD
          useradd -m builder && chown -R builder .   # makepkg refuses to run as root
          su builder -c "makepkg --nodeps --noconfirm"
          cp *.pkg.tar.zst "$GITHUB_WORKSPACE/out/"
          ls -lh "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: out/*

  android:
    # APK (install directly, or through Obtainium) and AAB (Play Store), signed with the release key.
    # The key must stay the same forever: Android only installs an update signed with the same key.
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: NDK
        # the runner image has the Android SDK already (setup-android fails on the retired 'tools' package)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses >/dev/null # Gradle fetches the platform and build tools it needs itself
          yes | "$SDKM" --install "ndk;30.0.14904198" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Signing key
        if: env.ANDROID_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/caretflow.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOP
          storeFile=$RUNNER_TEMP/caretflow.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          EOP
      - name: Build
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE not set: no Android files in this release (an APK signed with another key could never be updated)"
            exit 0
          fi
          npx tauri android build --apk --aab --target aarch64 armv7 x86_64
          V="${TAG#v}"
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk "out/CaretFlow-${V}.apk"
          cp src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab "out/CaretFlow-${V}.aab"
          ls -lh out
      - uses: actions/upload-artifact@v7
        if: env.ANDROID_KEYSTORE != ''
        with:
          name: android
          path: out/*

  publish:
    needs: [windows, linux, arch, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh files
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "CaretFlow ${TAG#v}" --notes "Release notes to follow."
          # update manifest for the in-app updater; notes come from the release text if it's written already
          if ls files/*.sig >/dev/null 2>&1; then
            gh release view "$TAG" --json body -q .body > notes.md
            node scripts/update-manifest.mjs files --version "${TAG#v}" --notes notes.md --repo "$GH_REPO"
          fi
          # the .sig files are only needed for latest.json (which contains the signatures), not as downloads
          find files -maxdepth 1 -type f ! -name '*.sig' -print0 | xargs -0 gh release upload "$TAG" --clobber
