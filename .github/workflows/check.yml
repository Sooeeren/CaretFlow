# Compiles CaretFlow for Windows, Linux and Android on every push and pull request (no installers, no release),
# so a change that breaks the build shows up before a version is tagged.
name: Check

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'packaging/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Frontend
        run: npm run build
      - name: Rust
        working-directory: src-tauri
        run: cargo check --locked
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --lib

  android:
    # a debug APK for 64-bit ARM phones: compiles the Rust side for Android and the Kotlin plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: NDK
        # the runner image has the Android SDK already (setup-android fails on the retired 'tools' package)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --install "ndk;30.0.14904198" "platforms;android-37" "build-tools;37.0.0" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Debug APK
        run: npx tauri android build --debug --apk --target aarch64
