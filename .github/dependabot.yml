# Weekly update pull requests. CaretFlow ships an auto-updater, so dependencies are kept current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns: ['@codemirror/*', 'codemirror', '@replit/codemirror-vim']
      milkdown:
        patterns: ['@milkdown/*']
      tauri-js:
        patterns: ['@tauri-apps/*']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ['tauri', 'tauri-*']
    ignore:
      # pdf.rs passes these types into Tauri's WebView2, so they must stay on the versions
      # Tauri uses; a newer windows-core is a separate, incompatible copy of the crate.
      - dependency-name: windows-core
      - dependency-name: webview2-com

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
