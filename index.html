<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
    <script>
      // Apply theme before first paint (no flash)
      try {
        var s = JSON.parse(localStorage.getItem('folio.settings') || '{}')
        var t = s.theme || 'paper'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'paper'
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="menubar" data-tauri-drag-region>
        <div id="menus"></div>
        <div id="tb-title" data-tauri-drag-region></div>
        <div id="win-controls">
          <button id="wc-min" title="Minimize" tabindex="-1">
            <svg viewBox="0 0 10 10"><path d="M1.5 5h7" /></svg>
          </button>
          <button id="wc-max" title="Maximize" tabindex="-1">
            <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" /></svg>
          </button>
          <button id="wc-close" title="Close" tabindex="-1">
            <svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" /></svg>
          </button>
        </div>
      </header>
      <div id="resize-edges">
        <div data-dir="North"></div><div data-dir="South"></div><div data-dir="East"></div><div data-dir="West"></div>
        <div data-dir="NorthEast"></div><div data-dir="NorthWest"></div><div data-dir="SouthEast"></div><div data-dir="SouthWest"></div>
      </div>
      <div id="main">
        <aside id="sidebar">
          <div class="sb-tabs">
            <button data-tab="files" title="Files (Ctrl+Shift+2)">Files</button>
            <button data-tab="outline" title="Outline (Ctrl+Shift+1)">Outline</button>
            <button data-tab="search" title="Search in folder (Ctrl+Shift+F)">Search</button>
          </div>
          <div class="sb-pane" id="sb-files">
            <div class="sb-head">
              <span id="root-name" title=""></span>
              <span class="sb-actions">
                <button id="btn-newfile" title="New file in folder">+</button>
                <button id="btn-openfolder" title="Open folder…">…</button>
              </span>
            </div>
            <div id="tree"></div>
          </div>
          <div class="sb-pane" id="sb-outline"><div id="outline"></div></div>
          <div class="sb-pane" id="sb-search">
            <input id="search-input" type="search" placeholder="Search in folder…" spellcheck="false" />
            <div id="search-results"></div>
          </div>
        </aside>
        <div id="resizer"></div>
        <section id="content">
          <div id="notice" hidden></div>
          <div id="scroller">
            <div id="wysiwyg"></div>
            <div id="source" hidden></div>
          </div>
          <div id="findbar" hidden>
            <div class="find-row">
              <input id="find-input" placeholder="Find" spellcheck="false" />
              <span id="find-count"></span>
              <button id="find-case" class="tog" title="Match case">Aa</button>
              <button id="find-word" class="tog" title="Whole word">W</button>
              <button id="find-regex" class="tog" title="Regular expression">.*</button>
              <button id="find-prev" title="Previous (Shift+Enter)">↑</button>
              <button id="find-next" title="Next (Enter)">↓</button>
              <button id="find-toggle-replace" title="Toggle replace (Ctrl+H)">⇄</button>
              <button id="find-close" title="Close (Esc)">✕</button>
            </div>
            <div class="find-row" id="replace-row" hidden>
              <input id="replace-input" placeholder="Replace" spellcheck="false" />
              <button id="replace-one">Replace</button>
              <button id="replace-all">All</button>
            </div>
          </div>
        </section>
        <div id="pv-resizer" hidden></div>
        <aside id="pagepreview" hidden>
          <div class="pv-bar">
            <span class="pv-title">Page preview</span>
            <span id="pv-status"></span>
            <span class="spacer"></span>
            <button id="pv-zoom-out" title="Zoom out">−</button>
            <span id="pv-zoom">Fit</span>
            <button id="pv-zoom-in" title="Zoom in">+</button>
            <button id="pv-settings" title="Paper, margins, header &amp; footer…">Page setup…</button>
            <button id="pv-refresh" title="Refresh now">⟳</button>
            <button id="pv-export" title="Export this PDF…">Export…</button>
            <button id="pv-close" title="Close preview (Ctrl+Alt+L)">✕</button>
          </div>
          <div id="pv-pages"></div>
        </aside>
      </div>
      <footer id="statusbar">
        <button id="sb-toggle" title="Toggle sidebar (Ctrl+Shift+L)">☰</button>
        <span id="st-path" title="Reveal in Explorer"></span>
        <span class="spacer"></span>
        <span id="st-flags"></span>
        <span id="st-wpm" hidden></span>
        <button id="st-wc" hidden></button>
        <button id="st-mode" title="Toggle source mode (Ctrl+/)">&lt;/&gt;</button>
        <span id="st-count" title=""></span>
      </footer>
    </div>

    <div id="palette" hidden>
      <div class="pal-box">
        <input id="pal-input" spellcheck="false" />
        <div id="pal-list"></div>
      </div>
    </div>
    <div id="modal" hidden></div>
    <div id="ctxmenu" hidden></div>
    <div id="toast"></div>
  </body>
</html>
