[package]
name = "caretflow"
version = "0.10.5"
description = "CaretFlow - a fast, seamless Markdown reader & editor"
edition = "2021"

[lib]
name = "caretflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# xdg-portal: native GNOME/KDE file pickers on Linux instead of the old GTK3 dialog
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.46"
tokio = { version = "1", features = ["sync", "time"] }
# Cloud sync (src/cloud.rs): the same HTTP client and TLS setup the updater already brings in
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.23"

# Native print-to-PDF backends (same versions Tauri itself uses)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

# Android: HTTPS checks certificates against Mozilla's root list (see cloud.rs client());
# reqwest's platform verifier would need Java-side setup and aborts the app without it
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
# Advanced Grammar (langtool.rs): unpacking LanguageTool and the Java runtime (the updater uses them too)
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
