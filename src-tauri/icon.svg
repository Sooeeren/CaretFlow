<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 452 452" width="512" height="512">
  <!-- Cropped to the rounded square: desktop taskbars expect icons to fill their box. -->
  <!-- Colors: warm alabaster, ink navy, slate gray and a cobalt dot. -->
  <defs>
    <linearGradient id="alabasterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA" />
      <stop offset="100%" stop-color="#EDEFF2" />
    </linearGradient>

    <linearGradient id="alabasterRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1F293B" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B97F8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#alabasterBg)" />
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="url(#alabasterRim)" stroke-width="2.5" />

  <g fill="none" stroke-width="24" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="146" ry="64" transform="rotate(32 256 256)" stroke="#BEC1C8" />
    <ellipse cx="256" cy="256" rx="146" ry="64" transform="rotate(-32 256 256)" stroke="#1F293B" />
  </g>

  <circle cx="256" cy="256" r="38" fill="#1F293B" />
  <circle cx="370" cy="182" r="15" fill="url(#cobalt)" />
</svg>
